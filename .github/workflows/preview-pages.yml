# お客様確認用プレビュー（GitHub Pages）
# 本番は Cloudflare Pages を予定。ここでは /mkokusai-renewal/ 配下で動くようにビルドします。
name: Preview (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_BASE_PATH: /mkokusai-renewal
          PUBLIC_SITE_URL: https://tenani2023.github.io
      - run: node tools/prefix-base.mjs dist /mkokusai-renewal
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
